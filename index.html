<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#315f2d">
  <meta name="description" content="塔克拉玛干植物光合重塑作业评价入口">
  <title>光合重塑 · 作业评价入口</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #233b22;
      --muted: #60705d;
      --green: #315f2d;
      --green-2: #4d7e42;
      --paper: rgba(255, 255, 255, .9);
      --line: rgba(76, 112, 65, .18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: max(24px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.72), transparent 28%),
        radial-gradient(circle at 90% 88%, rgba(202,218,164,.5), transparent 32%),
        linear-gradient(145deg, #edf5e6, #dce9cd);
    }
    main {
      width: min(calc(100vw - 36px), 760px);
      min-width: 0;
      padding: clamp(26px, 6vw, 52px);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(47, 78, 39, .14);
    }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--green-2);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .18em;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 44px);
      line-height: 1.15;
      letter-spacing: -.03em;
    }
    .intro {
      margin: 15px 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }
    .cards { min-width: 0; display: grid; gap: 14px; }
    .card {
      display: grid;
      min-width: 0;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 15px;
      padding: 18px;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fbfdf9;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(49, 95, 45, .42);
      box-shadow: 0 10px 28px rgba(47, 78, 39, .1);
      outline: none;
    }
    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #e7f0dc;
      font-size: 26px;
    }
    .card strong { display: block; font-size: 17px; overflow-wrap: anywhere; }
    .card span { display: block; min-width: 0; margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .arrow { color: var(--green); font-size: 24px; }
    .note {
      margin: 22px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.65;
    }
    @media (max-width: 460px) {
      main { border-radius: 22px; }
      .card { grid-template-columns: auto minmax(0, 1fr); }
      .arrow { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">在线学习任务</p>
    <h1>塔克拉玛干植物<br>“光合重塑”</h1>
    <p class="intro">请选择要完成的作业评价。建议使用手机浏览器打开，并在同一设备上完成作答。</p>

    <nav class="cards" aria-label="作业评价列表">
      <a class="card" href="z5001.html">
        <span class="icon" aria-hidden="true">🌾</span>
        <span><strong>Z5001 作业评价</strong><span>进入基础版评价页面</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="card" href="z5002.html">
        <span class="icon" aria-hidden="true">🔬</span>
        <span><strong>Z5002 科学探究版</strong><span>进入科学探究作业评价页面</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>

    <p class="note">隐私说明：作答与评价记录只保存在当前设备的浏览器中，不会上传到服务器。清除浏览器数据或更换设备后，历史记录将无法恢复。</p>
  </main>
</body>
</html>

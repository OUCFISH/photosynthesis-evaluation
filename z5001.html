<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>

<div class="container">

    <div class="header">
        <div class="header-left">
            <div class="header-icon">🌾</div>
            <div class="header-title">
                <h1>塔克拉玛干植物"光合重塑"</h1>
                <div class="sub">水稻的改良 · 作业评价系统</div>
            </div>
        </div>
        <div class="header-badge">📖 第5课时</div>
    </div>

    <div class="question-area">
        <div class="q-label">
            <span>📝 Z5001 (5)</span>
            <span class="tag">综合决策</span>
        </div>
        <div class="q-text">
            科研团队拟在塔克拉玛干沙漠边缘推广种植 CBP 水稻，并采用膜下滴灌技术。请依据图5-1（CBP水稻昼夜碳代谢机制）、图5-2（膜下滴灌原理）及所学知识，综合决策该种植方案在"双碳"目标背景下的可行性，并说明理由。
        </div>
    </div>

    <div class="input-area">
        <div class="label-row">
            <label for="answerInput"><span>✍️ 你的答案</span></label>
            <span class="word-count" id="wordCount">0 字</span>
        </div>
        <textarea id="answerInput" placeholder="请在此输入你的综合决策分析……"></textarea>
        <div class="btn-row">
            <button class="btn btn-primary" id="submitBtn">📤 提交答案</button>
            <button class="btn btn-outline" id="clearBtn">🗑️ 清空输入</button>
            <button class="btn btn-danger-outline" id="clearHistoryBtn">🧹 清空记录</button>
        </div>
        <div id="submitStatus" style="margin-top:12px; min-height:28px;"></div>
    </div>

    <div class="sand-dune"></div>

    <div class="result-area" id="resultArea">
        <div class="result-header">
            <span class="level-badge" id="levelBadge">水平0</span>
            <span class="level-label" id="levelLabel">未达标</span>
            <span style="margin-left:auto;font-size:14px;color:#5a7a48;" id="resultTime"></span>
        </div>

        <div class="feedback-box" id="feedbackBox">
            <div class="fb-title">📋 评价反馈</div>
            <div id="feedbackText">请提交你的答案以获取评价。</div>
        </div>

        <div class="advice-box" id="adviceBox">
            <div class="adv-title">🔧 修改建议</div>
            <div id="adviceText">提交答案后，这里会显示针对性的修改建议。</div>
        </div>

        <div class="score-detail" id="scoreDetail">
            <span><span class="dot green"></span> 水平1 基础</span>
            <span><span class="dot yellow"></span> 水平2 进阶</span>
            <span><span class="dot green"></span> 水平3 卓越</span>
            <span style="margin-left:auto;font-size:13px;color:#6a8a58;" id="detailHint">维度检测</span>
        </div>
    </div>

    <div class="history-area">
        <div class="h-title">
            <span>📜 提交历史</span>
            <span class="count" id="historyCount">0 条</span>
            <span class="control-btns">
                <button class="btn-small" id="expandAllBtn">展开全部</button>
                <button class="btn-small" id="collapseAllBtn">收起全部</button>
            </span>
        </div>
        <div class="history-list-wrap" id="historyListWrap">
            <div class="history-list" id="historyList">
                <div class="history-empty">🌱 暂无提交记录，开始作答吧！</div>
            </div>
        </div>
    </div>

</div>

<script>
(function() {
    "use strict";

    // ================================================================
    //  1. 关键词库
    // ================================================================

    const KW = {
        // A 可行（明确）
        A_feasible: ['可行', '可以', '能够', '能行'],

        // 用于水平2/3的A隐含检测（灌溉+协同）
        A_implicit_irri: ['滴灌', '膜下滴灌', '节水灌溉', '灌溉要求', '灌溉需求', '对灌溉要求更高', '配合膜下滴灌'],
        A_implicit_synergy: ['协同', '互补', '配合', '相辅相成', '相互', '共同'],

        // B: CAM代谢
        B: [
            ['cam', '景天酸', '景天酸代谢'],
            ['pepc', '磷酸烯醇式丙酮酸羧化酶', 'pep羧化酶'],
            ['苹果酸', 'malate'],
            ['脱羧', '释放co₂', '分解产生co₂'],
            ['卡尔文循环', 'c₃途径', '碳反应', '暗反应']
        ],

        // C: 光呼吸抑制
        C: [
            ['光呼吸'],
            ['rubisco', 'rubp羧化酶', 'r酶'],
            ['o₂', '氧气'],
            ['抑制', '竞争'],
            ['净固碳', '净光合']
        ],

        // D: 气孔失水矛盾
        D: [
            ['气孔导度', '气孔开度', '气孔开放', '气孔张开'],
            ['蒸腾', '水分散失', '失水', '耗水']
        ],

        // E: 滴灌原理（水平1仅提及；水平2/3需展开）
        E_mention: ['滴灌', '膜下滴灌', '节水灌溉', '灌溉', '补水'],
        E_detail: [
            ['地膜', '覆膜', '塑料薄膜'],
            ['蒸发', '保水', '保墒'],
            ['根区', '根系'],
            ['盐分', '淋洗', '下移', '迁移']
        ],

        // F: 协同双碳
        F: [
            ['协同', '互补', '配合', '相辅相成'],
            ['双碳', '碳中和', '碳达峰', '碳目标', '碳汇']
        ]
    };

    // ================================================================
    //  2. 维度检测函数
    // ================================================================

    function normalizeText(text) {
        return text.replace(/CO₂/g, 'co2').replace(/CO2/g, 'co2').replace(/二氧化碳/g, 'co2')
            .toLowerCase().replace(/[，,、。.；;：:！!？?""''（）()\s]+/g, ' ').trim();
    }

    function hasAny(text, keywords) {
        const n = normalizeText(text);
        return keywords.some(kw => n.includes(kw.toLowerCase()));
    }

    // ----- 维度A -----
    // 明确可行
    function hasFeasible(text) {
        return hasAny(text, KW.A_feasible);
    }

    // 隐含可行（灌溉+协同）
    function hasImplicitA(text) {
        return hasAny(text, KW.A_implicit_irri) && hasAny(text, KW.A_implicit_synergy);
    }

    // ----- 维度B -----
    function detectB(text) {
        for (const group of KW.B) {
            if (hasAny(text, group)) return true;
        }
        return false;
    }

    // ----- 维度C -----
    function detectC(text) {
        const hasPhoto = hasAny(text, ['光呼吸']);
        if (!hasPhoto) return false;
        const extra = ['rubisco', 'rubp', 'r酶', 'o₂', '氧气', '抑制', '竞争', '净固碳', '净光合'];
        return hasAny(text, extra);
    }

    // ----- 维度D -----
    function detectD(text) {
        return hasAny(text, KW.D[0]) && hasAny(text, KW.D[1]);
    }

    // ----- 维度E（提及 vs 展开）-----
    function detectE_mention(text) {
        return hasAny(text, KW.E_mention);
    }

    function detectE_detail(text) {
        let count = 0;
        for (const group of KW.E_detail) {
            if (hasAny(text, group)) count++;
        }
        return count >= 2;
    }

    // ----- 维度F -----
    function detectF(text) {
        return hasAny(text, KW.F[0]) && hasAny(text, KW.F[1]);
    }

    // ================================================================
    //  3. 综合评分（最终版）
    // ================================================================

    function evaluateAnswer(text) {
        const t = text || '';

        const feasible = hasFeasible(t);
        const implicitA = hasImplicitA(t);
        const A = feasible || implicitA;          // 用于水平2/3

        const B = detectB(t);
        const C = detectC(t);
        const D = detectD(t);
        const E_mention = detectE_mention(t);
        const E_detail = detectE_detail(t);
        const E = E_detail;                       // 水平2/3用展开
        const F = detectF(t);

        const dims = { A: A, B, C, D, E, F };
        const count = Object.values(dims).filter(Boolean).length;

        let level = 0;

        // ---- 水平1：B + E_mention（无需“可行”） ----
        if (B && E_mention) {
            level = 1;
        } else {
            level = 0;
        }

        // ---- 水平2：A（明确或隐含）+（D或E_detail）+ 总维度≥4 ----
        if (A && (D || E) && count >= 4) {
            level = 2;
        }

        // ---- 水平3：A（明确或隐含）+ 全部6个维度 ----
        if (A && B && C && D && E && F) {
            level = 3;
        }

        // 特殊：如果明确“不可行”且无任何灌溉条件，强制降为0
        const hasNegate = hasAny(t, ['不可行', '不能', '无法', '不适宜']);
        const hasAnyIrri = hasAny(t, KW.A_implicit_irri) || hasAny(t, KW.E_mention);
        if (hasNegate && !hasAnyIrri) {
            level = 0;
        }

        return {
            level: level,
            dims: dims,
            A: A,
            implicitA: implicitA,
            E_mention: E_mention,
            E_detail: E_detail,
            count: count
        };
    }

    // ================================================================
    //  4. 概念纠错检测
    // ================================================================

    function detectConceptErrors(text) {
        const errors = [];
        const t = text || '';

        if (hasAny(t, ['pepc', '磷酸烯醇式丙酮酸羧化酶', 'pep羧化酶']) &&
            hasAny(t, ['o₂', '氧气', '竞争']) &&
            hasAny(t, ['光呼吸'])) {
            errors.push({
                type: 'enzyme_confusion',
                message: '⚠️ 科学表述提醒：与O₂竞争、抑制光呼吸的酶是**Rubisco（R酶）**，而非PEPC。PEPC主要在夜间固定CO₂，不参与与O₂的竞争。建议将“PEPC”改为“Rubisco”或“R酶”。'
            });
        }

        if (hasAny(t, ['pepc', '磷酸烯醇式丙酮酸羧化酶', 'pep羧化酶']) &&
            hasAny(t, ['光呼吸']) &&
            !hasAny(t, ['rubisco', 'rubp', 'r酶'])) {
            errors.push({
                type: 'enzyme_missing',
                message: '⚠️ 科学表述提醒：光呼吸的抑制主要与**Rubisco（R酶）**有关，建议确认是否将PEPC与Rubisco混淆。PEPC主要负责夜间CO₂固定。'
            });
        }

        return errors;
    }

    // ================================================================
    //  5. 反馈内容
    // ================================================================

    function getFeedback(level, dims, A, implicitA, E_mention, E_detail, text) {
        const dimLabels = {
            A: '可行性前提' + (A ? (implicitA ? '（隐含）' : '（明确）') : ''),
            B: 'CAM代谢机制',
            C: '光呼吸抑制',
            D: '水分失衡矛盾',
            E: '滴灌补偿原理' + (E_detail ? '（展开）' : E_mention ? '（提及）' : ''),
            F: '协同与双碳'
        };

        const activeDims = Object.entries(dims)
            .filter(([k, v]) => v)
            .map(([k]) => dimLabels[k])
            .filter(Boolean);

        const errors = detectConceptErrors(text);

        let adviceText = '';
        if (level === 0) {
            if (!detectB(text) && !E_mention) {
                adviceText = '📌 建议从“CAM代谢机制”和“灌溉技术配合”两个角度补充分析。';
            } else if (!detectB(text)) {
                adviceText = '📌 你提到了灌溉，但还需要分析CBP水稻的固碳机制（CAM途径如何增强光合）。';
            } else if (!E_mention) {
                adviceText = '📌 你分析了CAM机制，但忽略了灌溉条件——在沙漠种植，必须说明膜下滴灌如何解决缺水问题。';
            } else {
                adviceText = '📌 你的回答还比较简略，建议从“代谢机制 → 灌溉补偿”两个核心环节充实论证。';
            }
            if (hasAny(text, ['不可行', '不能', '无法', '不适宜']) && !hasAny(text, KW.A_implicit_irri) && !E_mention) {
                adviceText += '\n\n💡 建议尝试从“在有灌溉条件下是否可行”的角度重新评估该方案。';
            }
        } else if (level === 1) {
            adviceText = '📌 你已覆盖CAM机制和灌溉技术。建议进一步展开：\n• 滴灌的具体原理（地膜覆盖减少蒸发、水分聚集根区、盐分下移）；\n• CBP水稻气孔开度增大带来的额外蒸腾需求；\n• 高CO₂如何抑制光呼吸、提高净固碳。';
        } else if (level === 2) {
            const missing = [];
            const dimMap = {
                B: 'CAM代谢机制（夜间固定CO₂→苹果酸→白天脱羧释放）',
                C: '光呼吸抑制机制（高CO₂如何抑制Rubisco与O₂结合）',
                D: '气孔失水矛盾（气孔导度增大→蒸腾失水增多）',
                E: '滴灌工作原理（地膜覆盖、根区水分、盐分迁移）',
                F: '协同与双碳关联'
            };
            for (const [key, label] of Object.entries(dimMap)) {
                if (!dims[key]) missing.push(label);
            }
            if (missing.length === 0) {
                adviceText = '📌 可深入思考CBP高光效带来的额外蒸腾需求，以及膜下滴灌如何通过“覆膜保水、根区供水、盐分下移”实现精准补偿。';
            } else {
                const suggestions = missing.map(m => {
                    if (m.includes('CAM')) return '• 补充CAM代谢的时序细节（夜间固定→苹果酸储存→白天脱羧释放）';
                    if (m.includes('光呼吸')) return '• 补充光呼吸抑制机制（高CO₂如何竞争性抑制Rubisco与O₂结合）';
                    if (m.includes('气孔')) return '• 补充气孔失水矛盾（光合增强为何伴随更多蒸腾消耗）';
                    if (m.includes('滴灌')) return '• 补充滴灌的工作原理（地膜覆盖减少蒸发、滴灌使水分聚集根区、盐分下移）';
                    if (m.includes('协同')) return '• 补充协同与双碳的关联（高碳汇与节水如何共同服务于双碳目标）';
                    return '• 补充相关维度的分析';
                });
                adviceText = '📌 冲击水平3需要完善以下环节：\n' + suggestions.join('\n');
            }
        } else if (level === 3) {
            if (errors.length > 0) {
                adviceText = '📌 ' + errors.map(e => e.message).join('\n');
            } else {
                adviceText = '';
            }
        }

        const base = {
            0: {
                label: '水平0 · 待完善',
                feedback: '你的回答尚未达到基本要求。' + (activeDims.length > 0 ? '\n\n已识别部分：' + activeDims.join('、') : '')
            },
            1: {
                label: '水平1 · 基础达标',
                feedback: '你已具备基本判断，并覆盖了核心要点。' + (activeDims.length > 0 ? '\n\n✅ 已识别：' + activeDims.join('、') : '')
            },
            2: {
                label: '水平2 · 进阶良好',
                feedback: '你的分析已经涵盖了多个核心维度，论证较为系统。' + (activeDims.length > 0 ? '\n\n✅ 已识别：' + activeDims.join('、') : '')
            },
            3: {
                label: '水平3 · 卓越',
                feedback: '🎉 你的回答已达到最高水平，逻辑严密，完整覆盖了可行性前提、CAM代谢、光呼吸抑制、水分失衡矛盾、滴灌补偿原理及协同双碳目标。' +
                    '\n\n✅ 已识别：' + activeDims.join('、')
            }
        };

        const result = base[level] || base[0];
        return {
            label: result.label,
            feedback: result.feedback,
            advice: adviceText
        };
    }

    // ================================================================
    //  6. 本地存储与历史管理
    // ================================================================

    const STORAGE_KEY = 'z5001_history';

    function getHistory() {
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        } catch { return []; }
    }

    function saveHistory(records) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function addRecord(text, level, feedback, advice) {
        const records = getHistory();
        records.push({
            time: new Date().toLocaleString('zh-CN', { hour12: false }),
            text: text.trim(),
            level: level,
            feedback: feedback,
            advice: advice,
            id: Date.now()
        });
        saveHistory(records);
        return records;
    }

    function clearHistory() {
        localStorage.removeItem(STORAGE_KEY);
    }

    // ================================================================
    //  7. UI 渲染
    // ================================================================

    function renderResult(level, feedbackText, adviceText, dims, A, implicitA, E_mention, E_detail) {
        const area = document.getElementById('resultArea');
        area.style.display = 'block';
        area.classList.add('show');

        const badge = document.getElementById('levelBadge');
        const label = document.getElementById('levelLabel');
        const fb = document.getElementById('feedbackText');
        const adv = document.getElementById('adviceText');
        const time = document.getElementById('resultTime');

        const levelMap = {
            0: { cls: 'l0', label: '水平0 · 待完善' },
            1: { cls: 'l1', label: '水平1 · 基础达标' },
            2: { cls: 'l2', label: '水平2 · 进阶良好' },
            3: { cls: 'l3', label: '水平3 · 卓越 🎉' }
        };
        const info = levelMap[level] || levelMap[0];

        badge.textContent = info.label;
        badge.className = 'level-badge ' + info.cls;
        label.textContent = info.label;

        fb.textContent = feedbackText;
        adv.textContent = adviceText;
        time.textContent = '📅 ' + new Date().toLocaleString('zh-CN', { hour12: false });

        const detail = document.getElementById('detailHint');
        if (dims) {
            const parts = [];
            for (const [key, val] of Object.entries(dims)) {
                let labelKey = key;
                if (key === 'A') {
                    labelKey += A ? (implicitA ? '✅隐含' : '✅明确') : '⬜';
                } else if (key === 'E') {
                    labelKey += E_detail ? '✅展开' : E_mention ? '⬜提及' : '⬜';
                } else {
                    labelKey += val ? '✅' : '⬜';
                }
                parts.push(labelKey);
            }
            detail.textContent = '维度: ' + parts.join(' ');
        } else {
            detail.textContent = '维度检测';
        }

        area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function renderHistory() {
        const records = getHistory();
        const list = document.getElementById('historyList');
        const count = document.getElementById('historyCount');

        count.textContent = records.length + ' 条';

        if (records.length === 0) {
            list.innerHTML = '<div class="history-empty">🌱 暂无提交记录，开始作答吧！</div>';
            return;
        }

        const levelNames = ['水平0', '水平1', '水平2', '水平3'];
        const levelCls = ['l0', 'l1', 'l2', 'l3'];

        let html = '';
        const sorted = [...records].reverse();
        for (const r of sorted) {
            const cls = levelCls[r.level] || 'l0';
            const lvName = levelNames[r.level] || '水平0';
            const preview = r.text.length > 80 ? r.text.slice(0, 80) + '…' : r.text;
            const safeText = r.text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safePreview = preview.replace(/</g, '&lt;').replace(/>/g, '&gt;');

            html += `
                <div class="history-item">
                    <div class="h-level ${cls}">${lvName}</div>
                    <div class="h-body">
                        <div class="h-text history-text" id="htext_${r.id}">${safePreview}</div>
                        <div class="h-meta">
                            <span>🕒 ${r.time}</span>
                            <button class="toggle-text" data-id="${r.id}">展开全文</button>
                        </div>
                    </div>
                </div>
            `;
        }
        list.innerHTML = html;

        document.querySelectorAll('.toggle-text').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = this.dataset.id;
                const el = document.getElementById('htext_' + id);
                const record = getHistory().find(r => r.id == id);
                if (!record) return;
                if (el.classList.contains('expand')) {
                    el.classList.remove('expand');
                    const preview = record.text.length > 80 ? record.text.slice(0, 80) + '…' : record.text;
                    el.textContent = preview.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    this.textContent = '展开全文';
                } else {
                    el.classList.add('expand');
                    el.textContent = record.text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    this.textContent = '收起';
                }
            });
        });
    }

    function expandAll() {
        document.getElementById('historyListWrap').classList.remove('hidden');
        document.querySelector('.history-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function collapseAll() {
        document.getElementById('historyListWrap').classList.add('hidden');
    }

    // ================================================================
    //  8. 提交与初始化
    // ================================================================

    function handleSubmit() {
        const input = document.getElementById('answerInput');
        const text = input.value.trim();

        if (!text) {
            alert('🌱 请至少输入1个字符！');
            return;
        }

        const result = evaluateAnswer(text);
        const level = result.level;
        const fbData = getFeedback(level, result.dims, result.A, result.implicitA, result.E_mention, result.E_detail, text);

        renderResult(level, fbData.feedback, fbData.advice, result.dims, result.A, result.implicitA, result.E_mention, result.E_detail);
        addRecord(text, level, fbData.feedback, fbData.advice);
        renderHistory();
        updateWordCount();

        const status = document.getElementById('submitStatus');
        status.innerHTML = '<span class="submit-success">✅ 提交成功！评价已生成</span>';
        setTimeout(() => { status.innerHTML = ''; }, 5000);

        expandAll();
        document.querySelector('.history-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function updateWordCount() {
        const input = document.getElementById('answerInput');
        document.getElementById('wordCount').textContent = input.value.length + ' 字';
    }

    document.addEventListener('DOMContentLoaded', function() {
        const input = document.getElementById('answerInput');
        const submitBtn = document.getElementById('submitBtn');
        const clearBtn = document.getElementById('clearBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const expandAllBtn = document.getElementById('expandAllBtn');
        const collapseAllBtn = document.getElementById('collapseAllBtn');

        input.addEventListener('input', updateWordCount);
        updateWordCount();

        submitBtn.addEventListener('click', handleSubmit);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                handleSubmit();
            }
        });

        clearBtn.addEventListener('click', function() {
            input.value = '';
            updateWordCount();
            input.focus();
            document.getElementById('submitStatus').innerHTML = '';
        });

        clearHistoryBtn.addEventListener('click', function() {
            if (getHistory().length === 0) {
                alert('📭 暂无历史记录。');
                return;
            }
            if (confirm('🧹 确定要清空所有提交历史吗？此操作不可撤销！')) {
                clearHistory();
                renderHistory();
                document.getElementById('resultArea').style.display = 'none';
                document.getElementById('resultArea').classList.remove('show');
                document.getElementById('submitStatus').innerHTML = '';
                expandAll();
            }
        });

        expandAllBtn.addEventListener('click', expandAll);
        collapseAllBtn.addEventListener('click', collapseAll);

        renderHistory();
        expandAll();

        if (getHistory().length === 0) {
            input.focus();
        }

        // 双击填充示例
        const examples = [
            'CBP水稻夜晚气孔打开吸收较多CO2合成苹果酸在液泡储存，白天液泡中苹果酸脱羧，释放CO2，使C5固定更多CO2参与碳反应，提高水稻固碳能力；但是CBP水稻气孔开度更大，固碳量更多，但是蒸腾失水也更多，所以对灌溉要求更高，配合膜下滴灌，CBP水稻和膜下滴灌二者协同互补，落实双碳目标。',
            'CBP水稻通过CAM途径提高固碳能力。',
            '配合膜下滴灌。',
            'CBP水稻CAM途径提高固碳，配合膜下滴灌。',
            '可行，CBP水稻夜晚气孔打开吸收较多CO2合成苹果酸在液泡储存，白天液泡中苹果酸脱羧，释放CO2，与O2竞争R酶，减弱光呼吸，使C5固定更多CO2参与碳反应，提高水稻固碳能力；但是CBP水稻气孔开度更大，固碳量更多，但是蒸腾失水也更多，所以对灌溉要求更高，配合膜下滴灌减少水分蒸发，促进盐分迁移至土壤深层，提高根部供水量并缓解盐胁迫，CBP水稻和膜下滴灌二者协同互补，落实双碳目标。'
        ];
        let exampleIdx = 0;
        input.addEventListener('dblclick', function(e) {
            if (input.value.trim() === '' || confirm('💡 填充示例答案？')) {
                input.value = examples[exampleIdx % examples.length];
                exampleIdx++;
                updateWordCount();
                input.focus();
            }
        });
    });

})();
</script>
